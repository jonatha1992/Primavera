                    <ellipse cx="13.14" cy="135.57" rx="2.90" ry="1.80" fill="#f6c02a" transform="rotate(136957.7 13.14 135.57)"/>
                    <ellipse cx="140.04" cy="15.06" rx="2.79" ry="1.74" fill="#eab426" transform="rotate(137095.2 140.04 15.06)"/>

                </svg>
            </div>
        </div>
    </div>

    <!-- Mensaje personalizado -->
    <div class="message-container">
        <div class="message">
            <span class="message__badge">Dedicatoria Especial <span class="heart-pulse">💛</span></span>
            <h1 class="message__title" id="destinatario">Una flor amarilla para ti 💛</h1>
            <p class="message__text" id="mensaje-texto">
                En este 21 de septiembre, te regalo esta flor amarilla<br>
                como símbolo de alegría, amistad y buenos deseos.<br>
                ¡Que tengas un hermoso Día de la Primavera!
            </p>
            <div class="message__signature" id="remitente">Con mucho cariño ✨</div>
            <div style="display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; margin-top: 14px;">
                <button class="message__action-btn btn-personalizar" style="background: linear-gradient(135deg, #FF9800 0%, #E65100 100%);">
                    <span>🎁</span> Regalar esta flor
                </button>
                <a href="index.html" class="message__action-btn" style="background: #ffffff; color: #b26505; border: 1px solid rgba(255, 193, 7, 0.6); box-shadow: 0 4px 14px rgba(0,0,0,0.06);">
                    <span>🌻</span> Versión Genérica
                </a>
            </div>
        </div>
    </div>

    <!-- Modal para personalizar y compartir -->
    <div class="modal-overlay" id="modal-personalizar" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <div class="modal-card">
            <div class="modal-header">
                <h2 class="modal-title" id="modal-title">🌻 Dedicar una Flor Amarilla</h2>
                <button class="modal-close" id="btn-close-modal" aria-label="Cerrar modal">&times;</button>
            </div>
            <div class="form-group">
                <label for="input-para">¿Para quién es la flor?</label>
                <input type="text" id="input-para" placeholder="Nombre de la persona" />
            </div>
            <div class="form-group">
                <label for="input-de">¿De parte de quién?</label>
                <input type="text" id="input-de" placeholder="Tu nombre" />
            </div>
            <div class="form-group">
                <label for="input-msg">Mensaje personalizado (opcional):</label>
                <textarea id="input-msg" rows="3" placeholder="Escribe unas palabras bonitas..."></textarea>
            </div>
            <div class="modal-actions">
                <button class="btn-secondary" id="btn-copy-link">
                    <span>📋</span> Copiar enlace personalizado
                </button>
            </div>
        </div>
    </div>

    <!-- Efecto de luz solar -->
    <div class="sunlight"></div>

    <!-- Lógica interactiva -->
    <script src="script.js"></script>
</body>

</html>
